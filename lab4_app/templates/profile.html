
{% extends "base.html" %}

{% block title %}Мій профіль{% endblock %}

{% block content %}
<div class="profile-card">
    <h1>Вітаємо, {{ username }}!</h1>
    <p>Ви успішно увійшли в систему.</p>

    <form method="POST" action="{{ url_for('logout') }}">
        <button type="submit" class="danger-button">
            Вийти
        </button>
    </form>
</div>
{% endblock %}
