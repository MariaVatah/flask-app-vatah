
{% extends "base.html" %}

{% block title %}Вхід у систему{% endblock %}

{% block content %}
<div class="login-card">
    <h1>Вхід у систему</h1>
    <p>Введіть свої облікові дані.</p>

    <form method="POST" action="{{ url_for('login') }}">
        <label for="username">Ім'я користувача</label>
        <input
            type="text"
            id="username"
            name="username"
            required
        >

        <label for="password">Пароль</label>
        <input
            type="password"
            id="password"
            name="password"
            required
        >

        <button type="submit">Увійти</button>
    </form>

    <p class="hint">
        Тестовий логін: student<br>
        Тестовий пароль: 12345
    </p>
</div>
{% endblock %}
