{% extends "base.html" %}

{% block title %}Список товарів{% endblock %}

{% block content %}
    <h2>Список товарів</h2>

    <div class="products">
        {% for product in products %}
            <article class="product">
                <h3>{{ product.name }}</h3>

                <p>{{ product.content }}</p>

                <p>
                    <strong>Ціна: {{ product.price }}</strong>
                </p>

                <a href="{{ url_for(
                    'products.detail_product',
                    product_id=product.id
                ) }}">
                    Детальніше
                </a>
            </article>
        {% endfor %}
    </div>
{% endblock %}
