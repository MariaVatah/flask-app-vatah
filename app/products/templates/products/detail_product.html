{% extends "base.html" %}

{% block title %}{{ product.name }}{% endblock %}

{% block content %}
    <h2>{{ product.name }}</h2>

    <p>{{ product.content }}</p>

    <p>
        <strong>Ціна: {{ product.price }}</strong>
    </p>

    <a href="{{ url_for('products.list_products') }}">
        Повернутися до списку товарів
    </a>
{% endblock %}
