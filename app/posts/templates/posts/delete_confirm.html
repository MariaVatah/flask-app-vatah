{% extends "base.html" %}

{% block title %}Видалення поста{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="card">
        <div class="card-body">
            <h1>Видалити пост?</h1>

            <p>
                Ви впевнені, що хочете видалити пост
                <strong>{{ post.title }}</strong>?
            </p>

            <form method="POST">
                <button type="submit" class="btn btn-danger">
                    Так, видалити
                </button>

                <a href="{{ url_for('posts.post_detail', id=post.id) }}"
                   class="btn btn-secondary">
                    Скасувати
                </a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
